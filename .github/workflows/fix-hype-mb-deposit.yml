name: One-off fix — hype-mb missing deposit

# Manual, one-off maintenance workflow. Reconstructs the R$40 PIX deposit that landed on
# hype-mb around 2026-07-31 as a proper capital_flows entry, retroactively re-basing
# shares_outstanding/nav_per_share for every affected portfolio_snapshots and trades row.
# See bot/src/scripts/fix-hype-mb-deposit.ts for the full derivation and CLAUDE.md's
# "Fund-share (NAV-per-share) Ledger" section for background.
#
# Read-only against the exchange (no MB credentials needed — only touches the SQLite
# artifact directly). Safe to re-run: it errors out if the DB has already been fixed
# (no trade found on/after 2026-07-31 to anchor against), and never modifies
# total_value_brl or any raw balance/price column, only shares_outstanding/nav_per_share.
#
# Delete this workflow file once the fix has been applied and verified — it's a one-off,
# not meant to become standing infrastructure.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: hype-mb-database
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Download database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./bot/data/hype-mb
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=hype-mb-database&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/db.zip
            unzip -o /tmp/db.zip -d ./bot/data/hype-mb/
            echo "Restored artifact $ARTIFACT_ID ($(du -h ./bot/data/hype-mb/shannonfi.db | cut -f1))"
          else
            echo "No artifact found — nothing to fix, aborting."
            exit 1
          fi

      - name: Install dependencies
        run: cd bot && npm ci

      - name: Build
        working-directory: ./bot
        run: npm run build

      - name: Dry run (prints the full plan)
        working-directory: ./bot
        run: npx ts-node src/scripts/fix-hype-mb-deposit.ts --config configs/hype-mb.yaml

      - name: Apply fix
        working-directory: ./bot
        run: npx ts-node src/scripts/fix-hype-mb-deposit.ts --config configs/hype-mb.yaml --apply

      - name: Upload corrected database artifact
        uses: actions/upload-artifact@v4
        with:
          name: hype-mb-database
          path: ./bot/data/hype-mb/shannonfi.db
          retention-days: 90
          overwrite: true
